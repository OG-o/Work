server {
    listen 6080 default_server;
    listen [::]:6080 default_server;

    server_name _;
    root /usr/share/novnc;
    index index.html vnc.html;

    # Microsoft Remote Desktop Gateway (RDGW) Endpoints over Port 443
    location /remoteDesktopGateway/ {
        proxy_pass https://127.0.0.1:9443/remoteDesktopGateway/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /rpc/ {
        proxy_pass https://127.0.0.1:9443/rpc/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static noVNC client files
    location / {
        try_files $uri $uri/ =404;
    }

    # WebSocket bridge to TigerVNC
    location /websockify {
        proxy_pass http://127.0.0.1:6081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Audio stream endpoint
    location /audio.mp3 {
        proxy_pass http://127.0.0.1:5711/audio.mp3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Window Manager & Task Switcher API
    location /api/ {
        proxy_pass http://127.0.0.1:5711/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
